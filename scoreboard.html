<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement, C'est qui ce bebew ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; overflow: hidden; }
/* La planche est composée en 1920×1080 puis mise à l'échelle de l'écran. */
.board { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--k, 1)); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
main { padding: 40px 56px 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; min-height: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; }
h1 { margin: 0 0 0 -6px; font-stretch: 125%; font-weight: 800; font-size: 84px; line-height: .86; letter-spacing: -.035em; text-transform: uppercase; }
h1 em { font-style: normal; color: var(--glow); }
.live { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; font-size: 18px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.live .rec { width: 14px; height: 14px; }
.side { display: flex; align-items: flex-end; gap: 48px; }
.counter { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.counter .seg { font-size: 112px; line-height: .9; }
.counter span:last-child { font-size: 20px; color: var(--muted); }

.toast-slot { height: 58px; }
.toast { display: inline-flex; align-items: center; gap: 18px; height: 58px; background: var(--glow); color: var(--ink); padding: 0 22px 0 14px; font-size: 26px; transform: rotate(-.6deg); box-shadow: 0 10px 24px rgba(0, 0, 0, .5); animation: slide .4s cubic-bezier(.2, .8, .2, 1); }
.toast b { font-stretch: 125%; font-weight: 800; text-transform: uppercase; font-size: 18px; letter-spacing: .02em; background: var(--ink); color: var(--glow); padding: 4px 10px; }
@keyframes slide { from { opacity: 0; transform: translateX(-30px) rotate(-.6deg); } }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; }
.roll .edge { display: flex; padding: 0 0 6px; }
.roll .edge span { flex: 1; padding-left: 14px; }
.roll .strip { display: flex; gap: 16px; padding: 22px 16px; }
.roll .strip::before, .roll .strip::after { background-size: 22px 12px; height: 12px; }
.f { flex: 1; position: relative; min-width: 0; background: radial-gradient(130% 100% at 50% 40%, #2E271E, #14110D); display: flex; flex-direction: column; justify-content: flex-end; padding: 22px 26px; transition: box-shadow 1.6s; }
.f.fresh { box-shadow: 0 0 0 3px var(--glow), 0 0 40px rgba(80, 175, 255, .45); transition: none; }
.f.blank { background: #16130F; }
.f .nm { font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: -.02em; line-height: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f .sc small { font-family: 'Archivo', sans-serif; color: var(--muted); text-shadow: none; letter-spacing: 0; font-weight: 600; }
.f .rk { position: absolute; top: 14px; left: 18px; }
.top3 .f { height: 270px; }
.top3 .nm { font-size: 64px; margin-bottom: 14px; }
.top3 .sc { font-size: 76px; }
.top3 .sc small { font-size: 28px; margin-left: 6px; }
.top3 .f.blank > span:last-child { font-size: 22px; color: #5E574B; font-weight: 600; }
.g1 { left: -22px; top: 50%; width: calc(100% + 44px); aspect-ratio: 2 / 1; transform: translateY(-50%); --sw: 2.2; --delay: .4s; }
.n1 { right: 24px; top: 14px; font-size: 46px; }
.tick { right: 26px; top: 22px; width: 60px; height: 46px; --delay: .8s; }

.rests { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.rest .strip { gap: 12px; padding: 18px 14px; }
.rest .strip::before, .rest .strip::after { height: 10px; background-size: 18px 10px; }
.rest .f { height: var(--fh, 120px); padding: 12px 18px; gap: 4px; }
.rest .nm { font-size: var(--fs, 28px); font-stretch: 110%; }
.rest .sc { font-size: calc(var(--fs, 28px) * 1.15); }
.rest .sc small { font-size: .5em; margin-left: 3px; }
.rest.compact .f { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px 0 52px; }
.rest.compact .rk { top: 50%; transform: translateY(-50%); left: 16px; font-size: 16px; }
.rest.compact .rk .v { display: none; }
.rest.compact .sc { flex: none; }
.gx { left: 10%; top: 50%; width: 80%; aspect-ratio: 2 / 1; max-height: 100%; transform: translateY(-50%); --sw: 2.6; --delay: 1.2s; }
/* Au-delà de 10 joueurs hors podium : une seule bande, liste en colonnes */
.list .strip { display: grid; grid-auto-flow: column; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); gap: 0 34px; padding: 22px 28px; height: 100%; }
.list { flex: 1; min-height: 0; }
.li { position: relative; display: flex; align-items: center; gap: .6em; font-size: var(--ls, 24px); min-width: 0; border-bottom: 1px dotted rgba(242, 238, 229, .16); padding: 0 .3em; transition: background 1.6s; }
.li.fresh { background: rgba(143, 211, 255, .22); transition: none; }
.li .rk { width: 2.2em; flex: none; font-size: .62em; }
.li .nm { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .sc { flex: none; font-size: 1.05em; }
.li .sc small { font-family: 'Archivo', sans-serif; font-size: .5em; color: var(--muted); text-shadow: none; letter-spacing: 0; margin-left: 2px; }
.gl { left: 2.2em; right: 0; top: 50%; width: calc(100% - 2.2em); height: 40px; transform: translateY(-50%); --sw: 7; --delay: 1.2s; }
.nl { right: 3.6em; top: -.55em; font-size: 1.15em; }
.nx { right: 14px; top: -4px; font-size: 30px; }

.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-bottom: 40px; }
.empty strong { font-stretch: 125%; font-weight: 800; font-size: 64px; line-height: .95; letter-spacing: -.03em; text-transform: uppercase; }
.empty span { font-size: 26px; color: var(--muted); }

/* Annonce des gagnants : 3e, puis 2e, puis 1re place */
.reveal { position: absolute; inset: 0; z-index: 50; background: var(--film); display: flex; flex-direction: column; padding: 56px 56px 40px; cursor: pointer; }
.reveal[hidden] { display: none; }
.reveal .meta { font-size: 18px; }
.reveal h2 { margin: 14px 0 0 -6px; font-stretch: 125%; font-weight: 800; font-size: 104px; line-height: .9; letter-spacing: -.035em; text-transform: uppercase; animation: slide .5s cubic-bezier(.2, .8, .2, 1); }
.reveal h2 em { font-style: normal; color: var(--glow); }
.rv-roll { margin: auto 0; }
.rv-roll .edge { display: flex; gap: 22px; padding: 0 22px 8px; font-size: 16px; }
.rv-roll .edge span { flex: 1; }
.rv-roll .edge span.p1 { flex: 1.35; }
.rv-roll .strip { display: flex; gap: 22px; padding: 30px 22px; }
.rv-roll .strip::before, .rv-roll .strip::after { height: 14px; background-size: 26px 14px; }
.rv-f { flex: 1; position: relative; min-width: 0; height: 470px; background: #120F0C; display: flex; flex-direction: column; justify-content: flex-end; padding: 30px 34px; }
.rv-f.p1 { flex: 1.35; }
.rv-f.on { background: radial-gradient(130% 100% at 50% 40%, #2E271E, #14110D); animation: develop 1.2s ease-out; }
.rv-f .rk { position: absolute; top: 18px; left: 22px; font-size: 16px; }
.rv-f .q { position: absolute; inset: 0; display: grid; place-items: center; font-stretch: 125%; font-weight: 800; font-size: 220px; color: #2A2620; transition: opacity .6s; }
.rv-f.on .q, .rv-f.blank .q { opacity: 0; }
.rv-f .pl { font-size: 24px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); }
.rv-f .nm { margin: 8px 0 14px; font-stretch: 125%; font-weight: 800; font-size: 76px; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-f.p1 .nm { font-size: 96px; }
.rv-f .pl, .rv-f .nm { opacity: 0; transform: translateY(14px); transition: opacity .6s, transform .6s cubic-bezier(.2, .8, .2, 1); }
.rv-f.named .pl, .rv-f.named .nm { opacity: 1; transform: none; }
.rv-f .sc { font-size: 110px; line-height: 1; opacity: 0; transition: opacity .3s; }
.rv-f.p1 .sc { font-size: 140px; }
.rv-f.on .sc { opacity: 1; }
.rv-f .sc small { font-family: 'Archivo', sans-serif; font-size: 36px; color: var(--muted); text-shadow: none; letter-spacing: 0; font-weight: 600; margin-left: 8px; }
.rv-f .g1 { --sw: 2; --delay: .1s; }
.rv-f .crown { right: 30px; top: 18px; font-size: 64px; animation: burn .4s 1s both; }
.rv-hint { display: flex; justify-content: space-between; font-size: 17px; color: var(--muted); }

.ticker { grid-column: 1; overflow: hidden; white-space: nowrap; background: var(--base); padding: 16px 0 14px; border-top: 1px solid #2B2620; }
.ticker > div { display: inline-block; animation: marq 45s linear infinite; font-size: 20px; }
</style>
</head>
<body>
<div class="board" id="board">
  <main>
    <div class="head">
      <h1>C'est qui<br><em>ce&nbsp;bebew</em>&nbsp;?</h1>
      <div class="side">
        <div class="live"><span class="rec"></span>En direct</div>
        <div class="counter"><span class="seg" id="count">00</span><span id="countLbl"></span></div>
      </div>
    </div>
    <div class="toast-slot" id="toast" aria-live="polite"></div>
    <div class="stage" id="stage"></div>
  </main>

  <div class="ticker edge" aria-hidden="true"><div id="ticker"></div></div>

  <section class="reveal" id="reveal" hidden aria-live="polite">
    <span class="meta"><span>Remise des prix</span></span>
    <h2 id="rvTitle"></h2>
    <div class="rv-roll" id="rvRoll"></div>
    <p class="rv-hint"><span id="rvHint"></span><span>Échap pour revenir au classement</span></p>
  </section>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const { esc, parseMessage, fetchScores, subscribe, loadConfetti } = Shared;
const params = new URLSearchParams(location.search);
const STORE = 'bebes_board_' + window.CANAL;
const CUTOFF = 'bebes_cutoff_' + window.CANAL;
const DEMO = [['Camille',19],['Thomas',14],['Julie',22],['Antoine',9],['Sarah',17],['Maxime',11],['Chloé',17],['Romain',6],['Laura',13],['Hugo',20],['Kevin',3],['Marion',15]];
const CIRCLE = 'M30 18 C 80 2, 168 4, 190 34 C 206 62, 170 94, 104 96 C 40 98, 4 80, 8 52 C 12 26, 54 10, 120 8';
const pad = n => String(n).padStart(2, '0');

const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// scoreboard.html?reset → on repart de zéro (les scores précédents sont ignorés)
if (params.has('reset')) {
  ls.set(CUTOFF, Math.floor(Date.now() / 1000));
  ls.set(STORE, []);
  params.delete('reset');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
}
const cutoff = ls.get(CUTOFF, 0);
const demo = params.has('demo');

// Les scores sont aussi gardés localement : ntfy.sh ne conserve les messages que 12 h.
const scores = new Map(ls.get(STORE, []).map(s => [s.id, s]));
let freshId = null, toast = null, toastTimer = null;

function add(msg, announce) {
  const s = parseMessage(msg);
  if (!s || s.time < cutoff || scores.has(s.id)) return false;
  scores.set(s.id, s);
  ls.set(STORE, [...scores.values()]);
  if (announce) {
    freshId = s.id;
    toast = s;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast = null;
      renderToast();
      const f = document.querySelector('.f.fresh, .li.fresh');
      if (f) f.classList.remove('fresh');
      freshId = null;
    }, 6000);
  }
  return true;
}

// ── Mise à l'échelle de l'écran ────────────────────────
const board = document.getElementById('board');
const fit = () => board.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
fit();
addEventListener('resize', fit);

// ── Rendu ──────────────────────────────────────────────
const $ = id => document.getElementById(id);

function ranked() {
  let list = [...scores.values()];
  if (demo && !list.length) {
    const total = window.BEBES.length;   // les scores de DEMO sont sur 25
    list = DEMO.map(([name, score], i) => ({ id: 'd' + i, name, score: Math.round(score * total / 25), total, ts: i }));
  }
  const sorted = list.sort((a, b) => b.score - a.score || a.ts - b.ts);
  let prev = null, rank = 0;
  return sorted.map((s, i) => {
    if (s.score !== prev) { rank = i + 1; prev = s.score; }
    return { ...s, rank };
  });
}

const sc = s => `<span class="seg sc">${pad(s.score)}<small>/${s.total}</small></span>`;
const fr = s => `class="f${s.id === freshId ? ' fresh' : ''}" data-id="${esc(s.id)}"`;

// Les traits au crayon ne se redessinent que si la personne marquée change.
const marked = { first: null, last: null };
function grease(cls, d, key, id) {
  const drawn = marked[key] === id ? ' drawn' : '';
  marked[key] = id;
  return `<svg class="grease ${cls}${drawn}" viewBox="0 0 200 100" aria-hidden="true"><path pathLength="1" d="${d}"/></svg>`;
}

function podium(r) {
  const cells = [0, 1, 2].map(i => {
    const s = r[i];
    if (!s) return `<div class="f blank"><span class="edge rk">Vue ${i + 1}</span><span>Vue libre</span></div>`;
    const mark = i === 0
      ? grease('g1', CIRCLE, 'first', s.id) + '<span class="scrawl hand n1">À tirer&nbsp;!</span>'
      : '<svg class="grease tick drawn" viewBox="0 0 60 46" aria-hidden="true"><path pathLength="1" d="M6 24 L 22 40 L 56 4"/></svg>';
    return `<div ${fr(s)}><span class="edge rk">Vue ${s.rank}</span>${mark}<span class="nm">${esc(s.name)}</span>${sc(s)}</div>`;
  });
  return `<section class="roll top3">
    <div class="edge" aria-hidden="true">${[1, 2, 3].map(i => `<span>▸ ${i}&emsp;▸ ${i}A</span>`).join('')}</div>
    <div class="strip">${cells.join('')}</div>
  </section>`;
}

function rest(r) {
  const list = r.slice(3);
  if (!list.length) return '';
  const last = r[r.length - 1];
  if (list.length > 10) {
    const c = list.length > 36 ? 4 : 3;
    return `<section class="roll list" style="--cols:${c};--rows:${Math.ceil(list.length / c)}"><div class="strip">${list.map(s => `
      <div class="li${s.id === freshId ? ' fresh' : ''}" data-id="${esc(s.id)}"><span class="edge rk">${s.rank}</span><span class="nm">${esc(s.name)}</span>${sc(s)}
        ${s === last ? grease('gl', 'M2 54 C 60 46, 140 52, 198 44', 'last', s.id).replace('viewBox="0 0 200 100"', 'viewBox="0 0 200 100" preserveAspectRatio="none"') + '<span class="scrawl hand nl">Voilé</span>' : ''}
      </div>`).join('')}</div></section>`;
  }
  const cols = 5;
  const rows = [];
  for (let i = 0; i < list.length; i += cols) rows.push(list.slice(i, i + cols));
  return rows.map(row => `
    <section class="roll rest"><div class="strip">${row.map(s => `
      <div ${fr(s)}><span class="edge rk"><span class="v">Vue&nbsp;</span>${s.rank}</span><span class="nm">${esc(s.name)}</span>${sc(s)}
        ${s === last ? grease('gx', 'M14 10 L 186 92 M 182 8 L 18 90', 'last', s.id) + '<span class="scrawl hand nx">Voilé</span>' : ''}
      </div>`).join('')}${'<div class="f blank"></div>'.repeat(cols - row.length)}</div></section>`).join('');
}

// Ajuste la hauteur des cadres du bas pour que toutes les bandes tiennent.
function fitRest() {
  const box = $('rests');
  if (!box) return;
  const list = box.querySelector('.list');
  if (list) {
    const rows = +list.style.getPropertyValue('--rows');
    const rowH = (box.clientHeight - 44) / rows;
    box.style.setProperty('--ls', Math.round(Math.max(15, Math.min(28, rowH * .6))) + 'px');
    return;
  }
  const strips = box.querySelectorAll('.rest');
  if (!strips.length) return;
  const per = (box.clientHeight - (strips.length - 1) * 12) / strips.length - 36;
  const fh = Math.max(40, Math.min(120, Math.floor(per)));
  box.style.setProperty('--fh', fh + 'px');
  box.style.setProperty('--fs', Math.round(Math.max(18, Math.min(28, fh * .26))) + 'px');
  strips.forEach(s => s.classList.toggle('compact', fh < 96));
}

function render() {
  const r = ranked();
  const n = r.length;

  if (!n) {
    marked.first = marked.last = null;
    $('stage').innerHTML = `${podium(r)}
      <div class="empty"><strong>Pellicule vierge.</strong><span>Personne n'a encore osé. Scannez le QR code pour être le premier à se ridiculiser.</span></div>`;
  } else {
    if (n <= 3) marked.last = null;
    $('stage').innerHTML = `${podium(r)}<div class="rests" id="rests">${rest(r)}</div>`;
    fitRest();
  }

  $('count').textContent = pad(n);
  $('countLbl').textContent = n === 0 ? 'Aucun film développé pour l’instant' : n === 1 ? 'film développé ce soir' : 'films développés ce soir';

  const last = n > 3 ? r[n - 1] : null;
  const tick = (last ? `Lanterne rouge : ${last.name}, ${last.score}/${last.total}. Voile total.   ▸ 22   ▸ 22A   Vous pouvez encore faire pire   ▸ 23   ▸ 23A   `
                     : `Pellicule 400 ISO   ▸ 1   ▸ 1A   Scannez le QR code pour jouer   ▸ 2   ▸ 2A   `);
  const ticker = $('ticker');
  if (ticker.dataset.text !== tick) {   // ne pas relancer le défilement si rien n'a changé
    ticker.dataset.text = tick;
    const t = esc(tick.repeat(4)).replace(/ {3}/g, '&emsp;');
    ticker.innerHTML = `<span>${t}</span><span>${t}</span>`;
  }
  renderToast();
}

const QUIPS = ['Net, très net.', 'Net, ou presque.', 'Un peu flou.', 'Voilé.'];
function renderToast() {
  const t = toast;
  if (!t) { $('toast').innerHTML = ''; return; }
  const r = t.score / t.total;
  const quip = QUIPS[r >= .8 ? 0 : r >= .55 ? 1 : r >= .3 ? 2 : 3];
  $('toast').innerHTML = `<div class="toast"><b>Nouveau tirage</b><span>${esc(t.name)} développe un ${t.score}/${t.total}. ${quip}</span></div>`;
}

// ── Annonce des gagnants ───────────────────────────────
// A (ou scoreboard.html?annonce) ouvre l'annonce ; Espace, Entrée, → ou un clic
// révèle la place suivante (3e, puis 2e, puis 1re) ; Échap revient au classement.
const reveal = $('reveal');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const TITLES = ['Le <em>Ballon d’Or</em>', 'Deuxième place', 'Troisième place'];
const NEXT = ['le Ballon d’Or', 'la 2e place', 'la 3e place'];
let snap = [], step = 0, busy = false;

function openReveal() {
  const all = ranked();
  snap = all.slice(0, 3);   // photo du podium au moment de l'annonce
  const label = s => (s.rank === 1 ? '1re' : s.rank + 'e') + ' place' + (all.filter(o => o.rank === s.rank).length > 1 ? ' ex æquo' : '');
  const order = [1, 0, 2];  // à l'écran : 2e, 1re, 3e
  $('rvRoll').innerHTML = `
    <div class="edge" aria-hidden="true">${order.map(i => `<span class="p${i + 1}">▸ ${i + 1}&emsp;▸ ${i + 1}A</span>`).join('')}</div>
    <div class="strip">${order.map(i => {
      const s = snap[i];
      return `<div class="rv-f p${i + 1}${s ? '' : ' blank'}" id="rv${i}"><span class="edge rk">Vue ${i + 1}</span><span class="q">?</span>${s
        ? `<span class="pl">${label(s)}</span><span class="nm">${esc(s.name)}</span><span class="seg sc"><b>00</b><small>/${s.total}</small></span>` : ''}</div>`;
    }).join('')}</div>`;
  step = snap.length;
  busy = false;
  $('rvTitle').innerHTML = step ? 'Et les gagnants sont…' : 'Personne n’a encore joué.';
  $('rvHint').textContent = step ? `Espace pour révéler ${NEXT[step - 1]}` : '';
  reveal.hidden = false;
}

function countUp(el, to, ms) {
  return new Promise(done => {
    if (reduce) { el.textContent = pad(to); return done(); }
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = pad(Math.round(to * (1 - Math.pow(1 - k, 3))));
      k < 1 ? requestAnimationFrame(tick) : done();
    };
    requestAnimationFrame(tick);
  });
}

async function next() {
  if (reveal.hidden || busy || step <= 0) return;
  busy = true;
  const i = --step, s = snap[i], f = $('rv' + i);
  $('rvTitle').innerHTML = TITLES[i];
  $('rvHint').textContent = '';
  await wait(600);
  f.classList.add('on');                        // le cadre se développe
  await wait(900);
  await countUp(f.querySelector('.sc b'), s.score, i ? 1600 : 2600);
  f.classList.add('named');                     // puis le prénom apparaît
  if (!i) {
    f.insertAdjacentHTML('beforeend', `<svg class="grease g1" viewBox="0 0 200 100" aria-hidden="true"><path pathLength="1" d="${CIRCLE}"/></svg><span class="scrawl hand crown">Ballon d’Or&nbsp;!</span>`);
    fete();
  }
  await wait(700);
  $('rvHint').textContent = step ? `Espace pour révéler ${NEXT[step - 1]}` : '';
  busy = false;
}

function fete() {
  const o = { colors: ['#8FD3FF', '#E3342F', '#F2EEE5', '#E4D6B4', '#FFD45A'], disableForReducedMotion: true };
  loadConfetti().then(confetti => {
    confetti({ ...o, particleCount: 160, angle: 60, spread: 70, startVelocity: 62, origin: { x: 0, y: .85 } });
    confetti({ ...o, particleCount: 160, angle: 120, spread: 70, startVelocity: 62, origin: { x: 1, y: .85 } });
    const end = Date.now() + 4000;
    (function rain() {
      confetti({ ...o, particleCount: 7, startVelocity: 0, ticks: 320, gravity: .6, origin: { x: Math.random(), y: -.05 } });
      if (Date.now() < end) setTimeout(rain, 120);
    })();
  }).catch(() => {});
}

addEventListener('keydown', e => {
  if (e.key === 'a' || e.key === 'A') { if (reveal.hidden) openReveal(); }
  else if (e.key === 'Escape') reveal.hidden = true;
  else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
});
reveal.addEventListener('click', next);

// ── Temps réel ─────────────────────────────────────────
async function poll(announce) {
  try {
    const msgs = await fetchScores(cutoff ? cutoff : 'all');
    let changed = false;
    msgs.forEach(m => { changed = add(m, announce) || changed; });
    if (changed) render();
  } catch (e) {}
}

render();
poll(false).then(() => {
  if (params.has('annonce')) openReveal();
  subscribe(Math.floor(Date.now() / 1000) - 5, m => { if (add(m, true)) render(); });
  // Filet de sécurité si la connexion temps réel décroche.
  setInterval(() => poll(true), 30000);
});
</script>
