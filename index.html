<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0C">
<title>C'est qui ce bebew ?</title>
<meta name="description" content="Le jeu de la crémaillère : retrouvez qui se cache derrière chaque photo de bébé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.app { min-height: 100vh; min-height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
.title { margin: 0; font-stretch: 125%; font-weight: 800; line-height: .9; letter-spacing: -.03em; text-transform: uppercase; }
.title em { font-style: normal; color: var(--glow); }

/* Accueil */
.home { flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 24px 20px calc(28px + env(safe-area-inset-bottom)); overflow: hidden; }
.home .title { font-size: clamp(36px, 11.2vw, 60px); margin-left: -3px; }
.bandeau { margin: 0 -20px; overflow: hidden; }
.bandeau .strip { display: flex; gap: 10px; padding: 16px 10px; width: max-content; animation: marq 70s linear infinite; }
.bandeau .fr { width: 66px; aspect-ratio: 3 / 4; background: #2A2620 center / cover no-repeat; }
.lead { margin: 0; font-size: 17px; line-height: 1.5; color: var(--soft); max-width: 34ch; }
.form { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
.form label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.form input { font: inherit; font-size: 20px; padding: 15px 18px; border: 0; border-radius: 3px; background: var(--print); color: var(--ink); outline: none; width: 100%; }
.form input::placeholder { color: #8A8478; }
.form input:focus { box-shadow: 0 0 0 3px var(--glow); }

/* Planche */
.game { display: flex; flex-direction: column; flex: 1; }
.ghead { padding: 22px 18px 4px; }
.ghead .title { font-size: 34px; margin: 12px 0 0 -2px; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--film); padding: 10px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border-bottom: 1px solid #2A2620; }
.mini { display: flex; gap: 3px; padding: 14px 4px; }
.mini::before, .mini::after { height: 8px; background-size: 12px 8px; }
.mini::before { top: 2px; } .mini::after { bottom: 2px; }
.mini i { flex: 1; height: 14px; background: #2E2A24; transition: background .3s, box-shadow .3s; }
.mini i.on { background: linear-gradient(#D6F0FF, var(--glow)); box-shadow: 0 0 6px rgba(80, 175, 255, .6); }
.count { display: flex; align-items: baseline; gap: 4px; }
.count .seg { font-size: 26px; }
.count .of { font-size: 15px; font-weight: 600; color: var(--muted); }
.help { margin: 0; padding: 12px 18px 0; font-size: 15px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 12px; padding: 18px 16px 130px; }
.tile { position: relative; display: block; width: 100%; padding: 0; text-align: left; }
.tile .print { transition: transform .2s; }
.tile:active .print { transform: rotate(var(--r)) scale(.97); }
.tile.on .print { outline: 2px solid var(--glow); outline-offset: 3px; }
.num { position: absolute; top: 5px; right: 5px; font-size: 11px; padding: 3px 4px 2px; background: rgba(15, 14, 12, .78); border-radius: 2px; }
.tile .tape { position: absolute; left: -4px; right: -4px; bottom: -9px; font-size: 19px; padding: 4px 6px 3px; animation: stick .25s ease-out; }
@keyframes stick { from { opacity: 0; transform: rotate(var(--t)) translateY(-6px) scale(1.08); } }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 28px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--film) 62%, rgba(15, 14, 12, 0)); }
.dock > div { max-width: 488px; margin: 0 auto; }
.dock .btn { background: rgba(15, 14, 12, .9); color: var(--glow); box-shadow: inset 0 0 0 2px var(--glow); transition: background .3s, color .3s, box-shadow .3s; }
.dock .btn.ready { background: var(--glow); color: var(--ink); box-shadow: 0 0 26px rgba(80, 175, 255, .35); }

/* Tirage développé */
.done { flex: 1; display: flex; flex-direction: column; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); overflow: hidden; }
.neg { margin: auto -30px; transform: rotate(-3deg); }
.neg .edge { display: flex; gap: 46px; padding: 0 0 6px 24px; }
.neg .row { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.frame { flex: none; width: 300px; height: 226px; position: relative; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 45%, #2C251C, #120F0C); animation: develop 1.6s ease-out both; }
.frame.ghost { width: 60px; background: #191612; animation: none; }
.score { font-size: 132px; line-height: 1; animation: burn 1.2s .9s steps(1, end) both; }
.score small { font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 600; color: var(--print); text-shadow: none; letter-spacing: 0; margin-left: 6px; }
.frame .grease { left: -10px; top: 50%; width: calc(100% + 20px); aspect-ratio: 2 / 1; transform: translateY(-50%); --sw: 3; --delay: 1.9s; }
.frame .scrawl { right: 40px; bottom: -66px; font-size: 32px; animation: burn .4s 2.8s both; }
.say h2 { margin: 0 0 12px -1px; font-stretch: 125%; font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: -.03em; text-transform: uppercase; text-wrap: balance; }
.say p { margin: 0; font-size: 17px; line-height: 1.5; color: var(--soft); max-width: 34ch; }
.foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid rgba(242, 238, 229, .18); display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); }

/* Choix du prénom */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.veil { position: absolute; inset: 0; background: rgba(0, 0, 0, .62); }
.sheet { position: relative; max-width: 520px; width: 100%; margin: 0 auto; background: var(--base); max-height: 84vh; max-height: 84dvh; display: flex; flex-direction: column; border-radius: 14px 14px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .6); animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; gap: 16px; align-items: center; padding: 18px 16px 16px; border-bottom: 1px solid #2E2A24; }
.sheet-head .print { width: 86px; flex: none; --r: -2deg; }
.sheet-title { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sheet-title strong { font-stretch: 125%; font-weight: 800; font-size: 22px; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; }
.close { width: 44px; height: 44px; flex: none; align-self: flex-start; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(242, 238, 229, .4); font-size: 22px; line-height: 1; }
.opts { overflow-y: auto; padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { min-height: 52px; text-align: left; padding: 9px 14px; border-radius: 3px; background: var(--cell); font-size: 17px; font-weight: 600; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.opt b { font-weight: 600; overflow-wrap: anywhere; }
.opt small { font-size: 12px; font-weight: 500; color: var(--muted); }
.opt.cur { background: var(--glow); color: var(--ink); }
.opt.cur small { color: var(--ink); opacity: .75; }
.opt.used { background: transparent; box-shadow: inset 0 0 0 1px #3A352D; color: #8C8579; }
.unset { grid-column: 1 / -1; min-height: 48px; font-size: 15px; color: var(--muted); text-decoration: underline; }

/* Confirmation */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .7); display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: var(--base); max-width: 420px; width: 100%; padding: 24px; border-radius: 4px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 1px #2E2A24, 0 24px 48px rgba(0, 0, 0, .6); }
.card strong { font-stretch: 125%; font-weight: 800; font-size: 26px; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; }
.card p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--soft); }
.card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card-btns button { min-height: 52px; border-radius: 3px; font-size: 16px; font-weight: 700; }
.b-back { box-shadow: inset 0 0 0 1.5px rgba(242, 238, 229, .45); }
.b-ok { background: var(--glow); color: var(--ink); }
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="layer"></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const { esc, shuffled, publishScore } = Shared;
const BEBES = window.BEBES;
const TOTAL = BEBES.length;
// ORDER[position affichée] = index du bébé dans la config
const ORDER = shuffled(TOTAL, window.MELANGE || 0);
const SORTED = BEBES.map((b, i) => ({ n: b.prenom, i })).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
const KEY = 'bebes_session_' + window.CANAL;
const bg = i => `url('${encodeURI(BEBES[i].photo).replace(/'/g, '%27')}')`;
const pad = n => String(n).padStart(2, '0');
const TILT = [-1.6, 1.1, -.7, 1.4, -1.2, .6];
const tilt = p => TILT[p % TILT.length];
const CIRCLE = 'M30 18 C 80 2, 168 4, 190 34 C 206 62, 170 94, 104 96 C 40 98, 4 80, 8 52 C 12 26, 54 10, 120 8';
const CROSS = 'M40 14 L 160 88 M 156 10 L 44 90';

let S = { screen: 'home', player: '', assign: {}, score: 0, entry: null, sent: false, at: 0 };
let active = null;

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && saved.total === TOTAL) S = { ...S, ...saved };
} catch (e) {}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ ...S, total: TOTAL })); } catch (e) {}
}
function set(patch) { S = { ...S, ...patch }; save(); }

const app = document.getElementById('app');
const layer = document.getElementById('layer');

// ── Écrans ─────────────────────────────────────────────
function render() {
  window.scrollTo(0, 0);
  if (S.screen === 'home') renderHome();
  else if (S.screen === 'game') renderGame();
  else renderDone();
}

function renderHome() {
  const vues = ORDER.map(bi => `<span class="fr" style="background-image:${bg(bi)}"></span>`).join('');
  app.innerHTML = `
  <div class="home">
    <div class="meta"><span>Crémaillère Izel et Maël</span></div>
    <h1 class="title">C'est qui<br><em>ce&nbsp;bebew</em>&nbsp;?</h1>
    <div class="bandeau" aria-hidden="true"><div class="strip">${vues}${vues}</div></div>
    <p class="lead">Vos amis ont un jour eu des joues rebondies et zéro responsabilité. <span style="white-space:nowrap">Saurez-vous</span> les reconnaitre&nbsp;?</p>
    <form class="form" id="f">
      <label for="name">Votre prénom</label>
      <input id="name" autocomplete="given-name" maxlength="40" placeholder="Ex. Édouard">
      <button class="btn" id="go" disabled>Commencer</button>
    </form>
  </div>`;
  const input = app.querySelector('#name'), go = app.querySelector('#go');
  input.value = S.player;
  const sync = () => { go.disabled = !input.value.trim(); };
  sync();
  input.oninput = () => { S.player = input.value; sync(); };
  app.querySelector('#f').onsubmit = e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    input.blur();
    set({ player: name, screen: 'game' });
    render();
  };
}

function renderGame() {
  app.innerHTML = `
  <div class="game">
    <header class="ghead">
      <div class="meta"><span>Planche de ${esc(S.player)}</span><span>${TOTAL} poses</span></div>
      <h1 class="title">C'est qui<br><em>ce&nbsp;bebew</em>&nbsp;?</h1>
    </header>
    <div class="bar">
      <div class="strip mini" id="mini" aria-hidden="true">${'<i></i>'.repeat(TOTAL)}</div>
      <div class="count" aria-label="Photos nommées"><span class="seg" id="cnt">00</span><span class="of">/${TOTAL}</span></div>
    </div>
    <p class="help">Touchez un tirage, puis notez qui c'est.</p>
    <div class="grid">
      ${ORDER.map((bi, p) => `
        <button class="tile" data-p="${p}" aria-label="Tirage ${p + 1}">
          <div class="print" style="--r:${tilt(p)}deg"><div class="img" style="background-image:${bg(bi)}"><span class="seg num">${pad(p + 1)}</span></div></div>
          <span class="tape hand" style="--t:${p % 2 ? 2 : -2.5}deg" hidden></span>
        </button>`).join('')}
    </div>
    <div class="dock"><div><button class="btn" id="submit"></button></div></div>
  </div>`;
  app.querySelectorAll('.tile').forEach(t => { t.onclick = () => openSheet(+t.dataset.p); });
  app.querySelector('#submit').onclick = openConfirm;
  updateGame();
}

function updateGame() {
  const done = Object.keys(S.assign).length;
  const missing = TOTAL - done;
  app.querySelector('#cnt').textContent = pad(done);
  app.querySelectorAll('#mini i').forEach((f, i) => f.classList.toggle('on', i < done));
  app.querySelectorAll('.tile').forEach(t => {
    const p = +t.dataset.p, tape = t.querySelector('.tape');
    const has = S.assign[p] !== undefined;
    tape.hidden = !has;
    tape.textContent = has ? BEBES[S.assign[p]].prenom : '';
    t.setAttribute('aria-label', `Tirage ${p + 1}${has ? ', ' + BEBES[S.assign[p]].prenom : ''}`);
    t.classList.toggle('on', active === p);
  });
  const btn = app.querySelector('#submit');
  btn.innerHTML = missing ? `Faire développer <small>${missing} sans nom</small>` : 'Faire développer';
  btn.classList.toggle('ready', !missing);
}

function renderDone() {
  const [title, text, mark, word] = verdict(S.score);
  const at = S.at ? new Date(S.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
  const s = S.score;
  app.innerHTML = `
  <div class="done">
    <div class="meta"><span>Tirage de ${esc(S.player)}</span><span>${at ? 'Développé à ' + at : ''}</span></div>
    <div class="neg" aria-hidden="true">
      <div class="edge"><span>▸ ${s ? s - 1 : 0}A</span><span>▸ ${s}</span><span>▸ ${s}A</span><span>▸ ${s + 1}</span><span>▸ ${s + 1}A</span></div>
      <div class="strip"><div class="row">
        <div class="frame ghost"></div>
        <div class="frame">
          <span class="seg score">${pad(s)}<small>/${TOTAL}</small></span>
          ${mark ? `<svg class="grease" viewBox="0 0 200 100"><path pathLength="1" d="${mark === 'circle' ? CIRCLE : CROSS}"/></svg>` : ''}
          <span class="scrawl hand">${word}</span>
        </div>
        <div class="frame ghost"></div>
      </div></div>
    </div>
    <section class="say">
      <h2>${title}</h2>
      <p>Votre score : ${s} sur ${TOTAL}. ${text}</p>
      <div class="foot" role="status"><span id="foot"></span><span class="rec" id="rec"></span></div>
    </section>
  </div>`;
  updateFoot();
}

function updateFoot() {
  const el = document.getElementById('foot');
  if (!el) return;
  el.textContent = S.sent ? 'Levez les yeux : votre tirage est sur la planche.' : 'Envoi de votre tirage vers l’écran…';
  document.getElementById('rec').classList.toggle('blink', !S.sent);
}

// [titre, texte, marque au crayon gras, mot griffonné]
function verdict(s) {
  const r = s / TOTAL;
  if (r === 1) return ['Net. Trop net.', 'Soit vous avez un don, soit vous avez fouillé les albums de famille de tout le monde. On ne veut pas savoir.', 'circle', 'À tirer !'];
  if (r >= .7) return ['Mise au point parfaite.', 'Vous reconnaissez vos amis même en 9×13 mat. Le labo est impressionné, et un peu inquiet.', 'circle', 'À tirer !'];
  if (r >= .4) return ['Un peu flou sur les bords.', 'Vous reconnaissez certains nez. Pour le reste, tous les bébés se ressemblent, on vous comprend.', '', 'À revoir'];
  if (r > 0) return ['Bougé.', 'Il y a eu du hasard. Beaucoup de hasard. Vos amis vous remercient de ne pas les avoir reconnus.', 'cross', 'À jeter'];
  return ['Voile total.', 'Rien n’est sorti. Statistiquement, c’est presque un exploit. Bravo, d’une certaine manière.', 'cross', 'Rien à tirer'];
}

// ── Choix du prénom (bottom sheet) ─────────────────────
function closeLayer() {
  layer.innerHTML = '';
  document.body.style.overflow = '';
}

function openSheet(p) {
  active = p;
  const byName = {};
  Object.entries(S.assign).forEach(([pos, n]) => { byName[n] = +pos; });
  const has = S.assign[p] !== undefined;
  layer.innerHTML = `
  <div class="sheet-wrap">
    <div class="veil" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Choisir un prénom pour le tirage ${p + 1}">
      <div class="sheet-head">
        <div class="print"><div class="img" style="background-image:${bg(ORDER[p])}"></div></div>
        <div class="sheet-title">
          <span class="meta"><span>Tirage n°${p + 1}</span></span>
          <strong>C'est qui, ce petit être&nbsp;?</strong>
        </div>
        <button class="close" data-close aria-label="Fermer">×</button>
      </div>
      <div class="opts">
        ${SORTED.map(({ n, i }) => {
          const on = byName[i];
          const cur = on === p, used = on !== undefined && !cur;
          return `<button class="opt${cur ? ' cur' : used ? ' used' : ''}" data-n="${i}">
            <b>${esc(n)}</b>${on !== undefined ? `<small>${cur ? 'Choix actuel' : 'Déjà sur le tirage ' + (on + 1)}</small>` : ''}
          </button>`;
        }).join('')}
        ${has ? '<button class="unset" data-unset>Retirer le prénom</button>' : ''}
      </div>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  layer.querySelectorAll('[data-close]').forEach(el => { el.onclick = hideSheet; });
  layer.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => {
      const ni = +el.dataset.n;
      const a = { ...S.assign };
      if (byName[ni] !== undefined) delete a[byName[ni]];
      a[p] = ni;
      set({ assign: a });
      hideSheet();
    };
  });
  const unset = layer.querySelector('[data-unset]');
  if (unset) unset.onclick = () => {
    const a = { ...S.assign };
    delete a[p];
    set({ assign: a });
    hideSheet();
  };
  updateGame();
}

function hideSheet() {
  const p = active;
  active = null;
  closeLayer();
  updateGame();
  const tile = app.querySelector(`.tile[data-p="${p}"]`);
  if (tile) tile.focus({ preventScroll: true });
}

// ── Confirmation & envoi ───────────────────────────────
function openConfirm() {
  const missing = TOTAL - Object.keys(S.assign).length;
  const title = missing ? `Il reste ${missing} bébé${missing > 1 ? 's' : ''} sans nom.` : 'Sûr de vous ?';
  const text = missing ? 'Ils compteront comme faux. Vous pouvez encore revenir en arrière.' : 'Une fois développé, impossible de changer. Pas de seconde chance, pas de recours.';
  layer.innerHTML = `
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="card">
      <strong id="mt">${title}</strong>
      <p>${text}</p>
      <div class="card-btns">
        <button class="b-back" id="back">Revoir</button>
        <button class="b-ok" id="ok">Développer</button>
      </div>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  layer.querySelector('#back').onclick = closeLayer;
  layer.querySelector('#ok').onclick = submit;
  layer.querySelector('#ok').focus();
}

function submit() {
  const score = Object.entries(S.assign).filter(([p, n]) => ORDER[+p] === n).length;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  set({ screen: 'done', score, entry: { id, name: S.player.trim(), score, total: TOTAL }, sent: false, at: Date.now() });
  closeLayer();
  render();
  send();
}

// Réessaie jusqu'à ce que le score soit bien parti (wifi capricieux en soirée…).
let sending = false;
async function send(delay = 2000) {
  if (sending || S.sent || !S.entry) return;
  sending = true;
  try {
    await publishScore(S.entry);
    set({ sent: true });
    updateFoot();
  } catch (e) {
    setTimeout(() => send(Math.min(delay * 1.5, 15000)), delay);
  } finally {
    sending = false;
  }
}

render();
if (S.screen === 'done') send();
</script>
</body>
</html>
